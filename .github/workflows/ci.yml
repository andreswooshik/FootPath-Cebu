name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Django backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements.lock
          pip install pip-audit bandit ruff==0.16.6
      - name: Lint and check formatting
        run: |
          ruff check .
          ruff format --check .
      - name: Audit Python dependencies and backend source
        run: |
          pip-audit --local
          bandit -r accounts academy config console portal scripts -x '*/migrations/*,*/tests.py' -ll -q
      - name: Run tests
        # The suite forces SQLite (see config.settings.TESTING) and mocks
        # Firebase, so no credentials or network are needed.
        env:
          DJANGO_SECRET_KEY: ci-only-placeholder-secret-0123456789-abcdefghijklmnopqrstuvwxyz
          DJANGO_DEBUG: '1'
        run: python manage.py test
      - name: Check migration drift
        env:
          DJANGO_SECRET_KEY: ci-only-placeholder-secret-0123456789-abcdefghijklmnopqrstuvwxyz
          DJANGO_DEBUG: '1'
        run: python manage.py makemigrations --check --dry-run
      - name: Deployment checks
        # Run Django's production checklist with DEBUG off — surfaces missing
        # HTTPS/HSTS/cookie hardening as warnings.
        env:
          DJANGO_SECRET_KEY: ci-only-placeholder-secret-0123456789-abcdefghijklmnopqrstuvwxyz
          DJANGO_ALLOWED_HOSTS: ci.example.test
          CORS_ORIGINS: https://app.example.test
          REDIS_URL: redis://127.0.0.1:6379/0
          DB_HOST: db.example.test
          DB_NAME: postgres
          DB_USER: ci
          DB_PASSWORD: ci-only-placeholder-password
          DB_SSLMODE: require
        run: python manage.py check --deploy
      - name: Validate operations scripts
        run: |
          python -m compileall -q scripts
          python scripts/postgres_backup.py --help
          python scripts/postgres_restore.py --help

  backend-postgres:
    name: Django PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: integration-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci-only-placeholder-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      DJANGO_DEBUG: '1'
      TEST_POSTGRES_HOST: 127.0.0.1
      TEST_POSTGRES_PASSWORD: integration-only-password
      TEST_POSTGRES_NAME: test_footpath
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.lock
      - run: python manage.py test --noinput

  container:
    name: Production container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate production Compose configuration
        env:
          DJANGO_SECRET_KEY: ci-only-placeholder-secret-0123456789-abcdefghijklmnopqrstuvwxyz
          DB_PASSWORD: ci-only-placeholder-password
        run: docker compose -f compose.production.yml config --quiet
      - name: Build backend image
        run: docker build -t footpath-backend:ci backend

  flutter:
    name: Flutter app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: footpath_cebu
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Test browser persistence
        run: flutter test --platform chrome test/data/web_attendance_outbox_browser_test.dart
      - name: Create ephemeral Android signing key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci-release.jks" -storepass ci-build-password -keypass ci-build-password -alias ci-build -keyalg RSA -keysize 2048 -validity 1 -dname "CN=CI build"
          echo "ANDROID_RELEASE_STORE_FILE=$RUNNER_TEMP/ci-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_STORE_PASSWORD=ci-build-password" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_KEY_ALIAS=ci-build" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_KEY_PASSWORD=ci-build-password" >> "$GITHUB_ENV"
      - name: Build release targets
        run: |
          flutter build web --release --no-pub
          flutter build apk --release --no-pub
