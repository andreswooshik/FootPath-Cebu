name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Match the SDK used to validate the committed Dart lockfile and tests.
  FLUTTER_VERSION: '3.44.2'
  PYTHON_VERSION: '3.12'
  PYTHON_DOTENV_DISABLED: '1'
  TZ: Asia/Manila

defaults:
  run:
    # Preserve test failures when output is piped to an artifact log.
    shell: bash

jobs:
  backend:
    name: Django backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install ruff==0.16.6
      - name: Lint backend
        run: python -m ruff check .
      - name: Check backend formatting
        run: python -m ruff format --check .
      - name: Run tests
        # The suite forces SQLite (see config.settings.TESTING) and mocks
        # Firebase, so no credentials or network are needed.
        env:
          DJANGO_SECRET_KEY: ci-only-placeholder-secret-0123456789-abcdefghijklmnopqrstuvwxyz
          DJANGO_DEBUG: '1'
        run: python manage.py test --noinput --verbosity 2 2>&1 | tee test-results.log
      - name: Check migration drift
        env:
          DJANGO_SECRET_KEY: ci-only-placeholder-secret-0123456789-abcdefghijklmnopqrstuvwxyz
          DJANGO_DEBUG: '1'
        run: python manage.py makemigrations --check --dry-run
      - name: Deployment checks
        # Production configuration warnings must fail the release gate.
        env:
          DJANGO_DEBUG: '0'
          DJANGO_SECRET_KEY: ci-only-placeholder-secret-0123456789-abcdefghijklmnopqrstuvwxyz
          DJANGO_ALLOWED_HOSTS: ci.example.test
          CORS_ORIGINS: https://app.example.test
          REDIS_URL: redis://127.0.0.1:6379/0
          DB_HOST: db.example.test
          DB_NAME: postgres
          DB_USER: ci
          DB_PASSWORD: ci-only-placeholder-password
          DB_SSLMODE: require
        run: python manage.py check --deploy --fail-level WARNING
      - name: Validate operations scripts
        run: |
          python -m compileall -q scripts
          python scripts/postgres_backup.py --help
          python scripts/postgres_restore.py --help
      - name: Upload backend test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-sqlite-tests
          path: backend/test-results.log
          retention-days: 7
          if-no-files-found: ignore

  security:
    name: Backend security checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install security tools
        run: python -m pip install pip-audit==2.10.1 bandit==1.9.4
      - name: Audit Python dependencies
        run: pip-audit -r requirements.lock --progress-spinner off
      - name: Audit backend source
        run: bandit -r accounts academy config console portal scripts -x '*/migrations/*,*/tests.py' -ll -q

  backend-postgres:
    name: Django PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: integration-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci-only-placeholder-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      DJANGO_DEBUG: '1'
      TEST_POSTGRES_HOST: 127.0.0.1
      TEST_POSTGRES_PORT: '5432'
      TEST_POSTGRES_USER: postgres
      TEST_POSTGRES_PASSWORD: integration-only-password
      TEST_POSTGRES_NAME: test_footpath
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - name: Run PostgreSQL tests including concurrency coverage
        run: python manage.py test --noinput --verbosity 2 2>&1 | tee test-results.log
      - name: Upload PostgreSQL test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-postgres-tests
          path: backend/test-results.log
          retention-days: 7
          if-no-files-found: ignore

  container:
    name: Production container
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [backend, backend-postgres, security]
    steps:
      - uses: actions/checkout@v7
      - name: Validate production Compose configuration
        env:
          DJANGO_SECRET_KEY: ci-only-placeholder-secret-0123456789-abcdefghijklmnopqrstuvwxyz
          DB_PASSWORD: ci-only-placeholder-password
        run: docker compose -f compose.production.yml config --quiet
      - name: Build backend image
        run: docker build -t footpath-backend:ci backend

  flutter:
    name: Flutter app
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: footpath_cebu
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libsqlite3-dev
          chrome_path="$(command -v google-chrome)"
          echo "CHROME_EXECUTABLE=$chrome_path" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Test
        run: flutter test --no-pub --reporter expanded 2>&1 | tee test-results.log
      - name: Test browser persistence
        timeout-minutes: 5
        run: flutter test --no-pub --platform chrome test/data/web_attendance_outbox_browser_test.dart 2>&1 | tee browser-test-results.log
      - name: Upload Flutter test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flutter-tests
          path: |
            footpath_cebu/test-results.log
            footpath_cebu/browser-test-results.log
          retention-days: 7
          if-no-files-found: ignore

  flutter-build:
    name: Flutter release builds
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: [backend, backend-postgres, security, container, flutter]
    defaults:
      run:
        working-directory: footpath_cebu
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Create ephemeral Android signing key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci-release.jks" -storepass ci-build-password -keypass ci-build-password -alias ci-build -keyalg RSA -keysize 2048 -validity 1 -dname "CN=CI build"
          echo "ANDROID_RELEASE_STORE_FILE=$RUNNER_TEMP/ci-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_STORE_PASSWORD=ci-build-password" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_KEY_ALIAS=ci-build" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_KEY_PASSWORD=ci-build-password" >> "$GITHUB_ENV"
      - name: Build web release
        run: flutter build web --release --no-pub
      - name: Build Android release
        run: flutter build apk --release --no-pub
      - name: Upload CI build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: flutter-ci-builds
          path: |
            footpath_cebu/build/web/
            footpath_cebu/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
          if-no-files-found: error
