name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Django backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        # The suite forces SQLite (see config.settings.TESTING) and mocks
        # Firebase, so no credentials or network are needed.
        env:
          DJANGO_SECRET_KEY: ci-test-key-not-secret
          DJANGO_DEBUG: '1'
        run: python manage.py test
      - name: Deployment checks
        # Run Django's production checklist with DEBUG off — surfaces missing
        # HTTPS/HSTS/cookie hardening as warnings.
        env:
          DJANGO_SECRET_KEY: ci-test-key-not-secret
        run: python manage.py check --deploy

  flutter:
    name: Flutter app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: footpath_cebu
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
