<svg xmlns="http://www.w3.org/2000/svg" width="600" height="850" viewBox="0 0 600 850" fill="none">
  <!-- ============================================================
       FootPath Cebu — player card TEMPLATE (original artwork)
       Transparent background. All the DYNAMIC text below (overall,
       position, name, the six stats) is drawn faintly here only so
       you can see the layout. In Flutter you overlay the real values
       on top with a Stack; either delete those layers before
       exporting a clean template, or keep them if you want a fully
       static demo card.
       ============================================================ -->

  <defs>
    <!-- Card body gradient: deep USJR green -->
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#0C4A34"/>
      <stop offset="0.55" stop-color="#0A3B2A"/>
      <stop offset="1"   stop-color="#072A1F"/>
    </linearGradient>
    <!-- Gold gradient for the frame + banners -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#E7C86A"/>
      <stop offset="0.5"  stop-color="#C9A227"/>
      <stop offset="1"    stop-color="#9C7B15"/>
    </linearGradient>
    <linearGradient id="goldBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7C86A"/>
      <stop offset="1" stop-color="#B8901E"/>
    </linearGradient>
  </defs>

  <!-- ================= CARD BODY ================= -->
  <!-- Drop shadow -->
  <rect x="42" y="40" width="516" height="778" rx="46" fill="#000000" opacity="0.25"/>
  <!-- Gold outer frame -->
  <rect x="34" y="30" width="532" height="790" rx="48" fill="url(#gold)"/>
  <!-- Green inner body -->
  <rect x="44" y="40" width="512" height="770" rx="40" fill="url(#body)"/>
  <!-- Thin inner gold hairline -->
  <rect x="58" y="54" width="484" height="742" rx="32" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.55"/>

  <!-- Decorative diagonal swoosh -->
  <path d="M44 300 L556 120 L556 200 L44 380 Z" fill="#ffffff" opacity="0.04"/>

  <!-- ================= HEADER ================= -->
  <!-- Neutral logo placeholder (center top) -->
  <circle cx="300" cy="108" r="34" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <text x="300" y="113" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#E7C86A" opacity="0.6">LOGO</text>

  <!-- ================= PHOTO AREA ================= -->
  <!-- Transparent placeholder circle for the player photo -->
  <circle cx="300" cy="270" r="130" fill="#ffffff" opacity="0.05"/>
  <circle cx="300" cy="270" r="130" fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-dasharray="6 8" opacity="0.7"/>
  <text x="300" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#E7C86A" opacity="0.5">PHOTO</text>

  <!-- ================= RATING + POSITION (DYNAMIC) ================= -->
  <text x="120" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF">99</text>
  <text x="120" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#E7C86A">ST</text>
  <!-- Flag + club chips under the rating -->
  <rect x="90" y="258" width="60" height="38" rx="6" fill="#ffffff" opacity="0.10" stroke="url(#gold)" stroke-width="1.5"/>
  <text x="120" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E7C86A" opacity="0.7">FLAG</text>
  <rect x="90" y="306" width="60" height="38" rx="6" fill="#ffffff" opacity="0.10" stroke="url(#gold)" stroke-width="1.5"/>
  <text x="120" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E7C86A" opacity="0.7">CLUB</text>

  <!-- ================= NAME BANNER (DYNAMIC) ================= -->
  <rect x="120" y="430" width="360" height="58" rx="10" fill="url(#goldBar)"/>
  <text x="300" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#072A1F" letter-spacing="1">PLAYER NAME</text>

  <!-- ================= STATS PANEL (DYNAMIC) ================= -->
  <!-- vertical divider between the two columns -->
  <line x1="300" y1="530" x2="300" y2="700" stroke="url(#gold)" stroke-width="2" opacity="0.6"/>

  <!-- Left column: PAC / SHO / PAS -->
  <g font-family="Arial, sans-serif" fill="#FFFFFF">
    <text x="170" y="558" font-size="34" font-weight="900" text-anchor="end">99</text>
    <text x="186" y="558" font-size="22" font-weight="700" fill="#E7C86A">PAC</text>
    <text x="170" y="618" font-size="34" font-weight="900" text-anchor="end">99</text>
    <text x="186" y="618" font-size="22" font-weight="700" fill="#E7C86A">SHO</text>
    <text x="170" y="678" font-size="34" font-weight="900" text-anchor="end">99</text>
    <text x="186" y="678" font-size="22" font-weight="700" fill="#E7C86A">PAS</text>
  </g>
  <!-- Right column: DRI / DEF / PHY -->
  <g font-family="Arial, sans-serif" fill="#FFFFFF">
    <text x="410" y="558" font-size="34" font-weight="900" text-anchor="end">99</text>
    <text x="426" y="558" font-size="22" font-weight="700" fill="#E7C86A">DRI</text>
    <text x="410" y="618" font-size="34" font-weight="900" text-anchor="end">99</text>
    <text x="426" y="618" font-size="22" font-weight="700" fill="#E7C86A">DEF</text>
    <text x="410" y="678" font-size="34" font-weight="900" text-anchor="end">99</text>
    <text x="426" y="678" font-size="22" font-weight="700" fill="#E7C86A">PHY</text>
  </g>

  <!-- ================= FOOTER BRAND ================= -->
  <text x="300" y="770" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#E7C86A" letter-spacing="3" opacity="0.85">FOOTPATH</text>
</svg>
